<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap');
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: 0.32em;
        fill: #FFFFFF;
      }
      .brand-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-weight: 500;
        font-size: 8.5px;
        letter-spacing: 0.55em;
        fill: rgba(255, 255, 255, 0.7);
      }
      .brand-dot {
        fill: #FFFFFF;
      }
      .brand-strip-border {
        stroke: rgba(255, 255, 255, 0.25);
        stroke-width: 1;
        fill: none;
      }
    </style>
  </defs>
  <!-- Optional subtle strip frame corners (pure white minimalist darkroom label aesthetic) -->
  <path d="M 12 20 L 12 12 L 20 12" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 468 20 L 468 12 L 460 12" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 12 60 L 12 68 L 20 68" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 468 60 L 468 68 L 460 68" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>

  <g transform="translate(240, 38)" text-anchor="middle">
    <text class="brand-title" x="0" y="0">MONOCHROME<tspan fill="#FFFFFF" opacity="0.9">.</tspan></text>
    <text class="brand-sub" x="0" y="20">LABORATORY · 35MM ARCHIVE</text>
  </g>
</svg>