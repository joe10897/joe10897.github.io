<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monochrome Lab - Promo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #f0f0f0;
      margin: 0;
      /* background texture */
      background-image: radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
    }
    
    .film-grain {
      position: fixed;
      top: -50vh; left: -50vw; width: 200vw; height: 200vh;
      pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.15; mix-blend-mode: overlay;
    }
    
    .promo-container {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5rem 1.5rem;
      position: relative;
      z-index: 10;
      max-width: 480px;
      margin: 0 auto;
    }

    .image-overlay {
      position: relative;
    }
    .image-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.6));
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="film-grain"></div>

  <div class="promo-container">
    
    <!-- 1. Header -->
    <header class="text-center w-full mt-4 mb-2">
      <h1 class="text-4xl md:text-5xl font-semibold tracking-wider text-transparent bg-clip-text bg-gradient-to-br from-gray-100 via-gray-300 to-gray-500">Monochrome<br>Lab.</h1>
    </header>

    <!-- 2. Main Content (Grid + Services) -->
    <main class="w-full flex-grow flex flex-col justify-center py-6">
      
      <!-- 作品縮圖 Grid -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <!-- 主圖 -->
        <div class="col-span-2 h-44 rounded-2xl overflow-hidden border border-white/10 shadow-lg image-overlay relative">
          <img src="images/C&Y/DSCF3480-編輯.jpg" alt="Portfolio 1" class="absolute inset-0 w-full h-full object-cover">
        </div>
        <!-- 副圖 1 -->
        <div class="aspect-square rounded-2xl overflow-hidden border border-white/10 shadow-lg relative">
          <img src="images/Peggy1/peggy1.jpg" alt="Portfolio 2" class="absolute inset-0 w-full h-full object-cover">
        </div>
        <!-- 副圖 2 -->
        <div class="aspect-square rounded-2xl overflow-hidden border border-white/10 shadow-lg relative">
          <img src="images/Vivian/v1.jpg" alt="Portfolio 3" class="absolute inset-0 w-full h-full object-cover">
        </div>
      </div>

      <!-- 接案服務清單 -->
      <div class="bg-black/50 border border-white/5 rounded-2xl p-5 shadow-2xl backdrop-blur-md relative overflow-hidden">
        <!-- 裝飾光暈 -->
        <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 blur-2xl rounded-full translate-x-1/2 -translate-y-1/2"></div>
        
        <div class="flex items-center mb-4 border-b border-white/10 pb-3 relative z-10">
          <span class="w-1.5 h-1.5 rounded-full bg-gray-300 mr-2 shadow-[0_0_5px_rgba(255,255,255,0.8)]"></span>
          <h3 class="text-xs font-semibold tracking-[0.2em] uppercase text-gray-200">服務項目 Services</h3>
        </div>
        <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-sm text-gray-400 font-medium tracking-wide relative z-10">
          <p class="flex items-center"><span class="text-gray-600 mr-2 text-[10px]">✦</span>商業攝影</p>
          <p class="flex items-center"><span class="text-gray-600 mr-2 text-[10px]">✦</span>婚禮紀錄</p>
          <p class="flex items-center"><span class="text-gray-600 mr-2 text-[10px]">✦</span>人像寫真</p>
          <p class="flex items-center"><span class="text-gray-600 mr-2 text-[10px]">✦</span>文物紀實</p>
          <p class="flex items-center col-span-2"><span class="text-gray-600 mr-2 text-[10px]">✦</span>短影音拍攝與剪輯</p>
        </div>
      </div>

    </main>

    <!-- 3. Footer (QR Code) -->
    <footer class="w-full mb-2">
      <div class="flex items-center justify-between bg-gradient-to-r from-white/10 to-transparent p-3 pr-4 rounded-2xl border border-white/10 backdrop-blur-md">
        <div class="flex items-center">
          <div class="w-16 h-16 bg-white p-1 rounded-xl shadow-lg flex-shrink-0 relative">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://nomochrome.site/&color=000000&bgcolor=ffffff&qzone=1" alt="QR Code" class="w-full h-full rounded-lg">
          </div>
          <div class="ml-4">
            <p class="text-[9px] uppercase font-bold tracking-[0.3em] text-gray-400 mb-1">Scan to Explore</p>
            <p class="text-sm font-semibold tracking-wider text-white">nomochrome.site</p>
          </div>
        </div>
        <!-- 箭頭裝飾 -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </div>
    </footer>

  </div>
</body>
</html>
