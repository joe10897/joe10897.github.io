<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任務罐 APP v6.9.2 (最終修正版)</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fff1f2', 100: '#ffe4e6', 500: '#f43f5e', 600: '#e11d48' },
                        ink: '#1d1d1f',
                    },
                    boxShadow: { 'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)' }
                }
            }
        }
    </script>
    
    <!-- 載入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 載入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 載入 Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #1d1d1f; overflow: hidden; background: #f5f5f7; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        
        @keyframes float-in { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-float-in { animation: float-in 0.5s ease-out forwards; }
        
        @keyframes slide-in-top { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slide-in-top 0.3s ease-out forwards; }

        @keyframes wave { 0% { background-position-x: 0; } 100% { background-position-x: 100px; } }
        .liquid-wave { background-size: 200% 100%; animation: wave 8s linear infinite; }
        
        @keyframes glow { 0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); border-color: #f59e0b; } 50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.7); border-color: #fbbf24; } }
        .jar-complete { animation: glow 3s ease-in-out infinite; }

        .ambient-light { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; border-radius: 50%; animation: move 20s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #ffcfd2; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #c7d2fe; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(50px, 50px) scale(1.1); } }
    </style>
</head>
<body class="antialiased h-screen flex flex-col">

    <div class="ambient-light"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div id="root" class="flex-1 flex flex-col h-full z-10 relative"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const APP_ICON_URL = "https://upload.wikimedia.org/wikipedia/zh/7/73/Chihlee_University_of_Technology_round_logo.png";
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- 1. ICONS ---
        const Icons = {
            Google: () => <svg className="w-5 h-5 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>,
            Menu: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Wrench: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>,
            Plus: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ChevronLeft: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="15 18 9 12 15 6"></polyline></svg>,
            ChevronRight: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Send: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            History: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path><path d="M12 6v6l4 2"></path></svg>,
            Users: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            Home: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            MessageCircle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
            Bot: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>,
            Trophy: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            JarEmpty: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 2h4"/><path d="M6 5h12"/><path d="M6 5v14a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V5"/></svg>,
            Check: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Cloud: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>,
            CloudCheck: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21a6 6 0 0 1-6-6c0-3.3 2.7-6 6-6 .5 0 1 .1 1.5.2"/><path d="M19 12v.2"/><path d="M16.5 6A6 6 0 0 1 22 11v1a6 6 0 0 1-5 6h-2"/><path d="m9 11 3 3L22 4"/></svg>,
            CloudOff: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
            Link: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
            AlertTriangle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            RefreshCw: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>,
            Loader: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>,
            Edit: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Save: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
            X: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            UserPlus: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>,
            Share: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>,
            Search: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Bell: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            CheckCircle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        };

        // --- 2. API Helper ---
        const api = {
            post: async (url, action, payload) => {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action, ...payload })
                    });
                    return await response.json();
                } catch (e) {
                    console.error("API POST Error:", e);
                    throw e;
                }
            },
            get: async (url, action, params) => {
                const query = new URLSearchParams({ action, ...params, t: new Date().getTime() }).toString();
                try {
                    const response = await fetch(`${url}?${query}`);
                    if (!response.ok) throw new Error("Network response not ok");
                    return await response.json();
                } catch (e) {
                    console.error("API GET Error:", e);
                    throw e;
                }
            }
        };

        // --- 3. BASIC COMPONENTS ---

        const ToastContainer = ({ toasts }) => (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none">
                {toasts.map(t => (
                    <div key={t.id} className="bg-white/90 backdrop-blur-md shadow-lg border border-white/50 rounded-xl p-3 flex items-center gap-3 animate-slide-in pointer-events-auto">
                        {t.type === 'success' ? <div className="bg-green-100 p-1 rounded-full text-green-600"><Icons.Check className="w-4 h-4"/></div> : <div className="bg-blue-100 p-1 rounded-full text-blue-600"><Icons.Bell className="w-4 h-4"/></div>}
                        <span className="text-sm font-medium text-ink">{t.msg}</span>
                    </div>
                ))}
            </div>
        );

        // --- 4. MODALS & SUB-VIEWS (Defined BEFORE App) ---

        const NPCWizard = ({ isOpen, onClose, steps, onComplete, title, friends = [] }) => {
            const [currentStep, setCurrentStep] = useState(0);
            const [answers, setAnswers] = useState({});
            
            if (!isOpen) return null;
            const step = steps[currentStep];

            const handleNext = () => {
                if (currentStep < steps.length - 1) {
                    setCurrentStep(currentStep + 1);
                } else {
                    onComplete(answers);
                    setAnswers({});
                    setCurrentStep(0);
                    onClose();
                }
            };
            const handleChange = (val) => setAnswers({...answers, [step.key]: val});
            
            const handleMultiSelect = (val) => {
                const current = answers[step.key] || [];
                if (current.includes(val)) handleChange(current.filter(x => x !== val));
                else handleChange([...current, val]);
            };

            return (
                <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-float-in">
                    <div className="glass-panel rounded-2xl w-full max-w-md shadow-xl overflow-hidden border-t border-white/50 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-white/80 hover:text-white z-10 p-1"><Icons.X className="w-6 h-6" /></button>
                        <div className="bg-brand-500/90 backdrop-blur-md p-4 flex items-center border-b border-white/10">
                            <div className="w-10 h-10 bg-white/90 rounded-full flex items-center justify-center text-2xl mr-3 shadow-sm">🤖</div>
                            <h3 className="text-white font-bold text-lg tracking-wide">{title}</h3>
                        </div>
                        <div className="p-6">
                            <div className="mb-6 bg-white/40 p-4 rounded-xl rounded-tl-none border border-white/30 text-ink shadow-sm">
                                <p className="font-medium text-lg">{step.question}</p>
                            </div>
                            
                            {step.type === 'text' && (
                                <input type="text" className="w-full border-2 border-white/50 rounded-xl p-3 outline-none focus:border-brand-500 bg-white/60 backdrop-blur-sm transition-colors text-lg" placeholder="請輸入..." value={answers[step.key] || ''} onChange={(e) => handleChange(e.target.value)} autoFocus />
                            )}
                            
                            {step.type === 'select' && (
                                <select className="w-full border-2 border-white/50 rounded-xl p-3 outline-none bg-white/60 backdrop-blur-sm focus:border-brand-500 transition-colors text-lg" value={answers[step.key] || step.options[0]} onChange={(e) => handleChange(e.target.value)}>
                                    {step.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                            )}

                            {step.type === 'multi-friend' && (
                                <div className="space-y-2 max-h-48 overflow-y-auto">
                                    {friends.length === 0 ? <p className="text-slate-400 text-sm">暫無好友可選 (跳過)</p> : 
                                    friends.map(f => (
                                        <div key={f} onClick={() => handleMultiSelect(f)} className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition-colors ${(answers[step.key] || []).includes(f) ? 'border-brand-500 bg-brand-50/50' : 'border-white/50 bg-white/40'}`}>
                                            <span>{f}</span>
                                            {(answers[step.key] || []).includes(f) && <Icons.Check className="w-4 h-4 text-brand-600" />}
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="mt-8 flex justify-end">
                                <button onClick={handleNext} disabled={!answers[step.key] && step.type !== 'select' && step.type !== 'multi-friend'} className="bg-brand-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-brand-500 disabled:opacity-50 transition-all shadow-md active:scale-95">
                                    {currentStep === steps.length - 1 ? "完成" : "下一步"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ChatRoom = ({ me, friendId, dbUrl, onClose }) => {
            const [msgs, setMsgs] = useState([]);
            const [input, setInput] = useState('');
            const endRef = useRef(null);

            const loadMsgs = useCallback(async () => {
                try {
                    const res = await api.get(dbUrl, 'get_chat', { userId: me, friendId });
                    if (res.result === 'success') setMsgs(res.messages);
                } catch(e) { }
            }, [dbUrl, me, friendId]);

            useEffect(() => {
                loadMsgs();
                const timer = setInterval(loadMsgs, 5000);
                return () => clearInterval(timer);
            }, [loadMsgs]);

            useEffect(() => { 
                endRef.current?.scrollIntoView({ behavior: "smooth" }); 
            }, [msgs]);

            const send = async () => {
                if (!input.trim()) return;
                const tempMsg = { sender: me, text: input, time: new Date().toISOString() };
                setMsgs(prev => [...prev, tempMsg]);
                setInput('');
                try { await api.post(dbUrl, 'send_message', { userId: me, friendId, message: tempMsg.text }); } catch(e){}
                loadMsgs();
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-100 flex flex-col animate-float-in">
                    <div className="glass-panel p-4 flex items-center gap-3 shadow-sm z-10 bg-white/80">
                        <button onClick={onClose}><Icons.ChevronLeft className="w-6 h-6 text-slate-600" /></button>
                        <h3 className="font-bold text-lg">{friendId}</h3>
                    </div>
                    
                    {/* Chat Messages Area - Fixed Reverse Order */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#e5e5ea] flex flex-col">
                        <div className="flex-1"></div>
                        {[...msgs].reverse().map((m, i) => (
                            <div key={i} className={`flex ${m.sender === me ? 'justify-end' : 'justify-start'} mb-3`}>
                                <div className={`p-3 rounded-2xl max-w-[80%] text-sm shadow-sm ${m.sender === me ? 'bg-blue-500 text-white rounded-br-none' : 'bg-white text-black rounded-bl-none'}`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="p-3 bg-white flex gap-2 border-t border-slate-200">
                        <input className="flex-1 bg-slate-100 rounded-full px-4 py-2 outline-none" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="傳送訊息..." />
                        <button onClick={send} className="bg-blue-500 text-white p-2 rounded-full"><Icons.Send className="w-5 h-5" /></button>
                    </div>
                </div>
            );
        };

        const ShareJarModal = ({ isOpen, onClose, jar, friends, onShare }) => {
            const [selectedFriends, setSelectedFriends] = useState([]);
            if (!isOpen) return null;
            const toggleFriend = (fid) => {
                if (selectedFriends.includes(fid)) setSelectedFriends(selectedFriends.filter(f => f !== fid));
                else setSelectedFriends([...selectedFriends, fid]);
            };
            return (
                <div className="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-float-in">
                    <div className="glass-panel bg-white/90 p-6 rounded-2xl w-full max-w-sm shadow-xl relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><Icons.X className="w-5 h-5" /></button>
                        <h3 className="font-bold text-lg mb-4">共享「{jar.name}」給好友</h3>
                        <div className="space-y-2 max-h-60 overflow-y-auto mb-4">
                            {friends.length === 0 ? <p className="text-slate-400 text-sm">暫無好友可分享</p> :
                            friends.map(f => (

        // --- 6. MAIN APP ---

        function App() {
            // ... (State same as v6.0)
            const [view, setView] = useState('login');
            const [cabinets, setCabinets] = useState([]);
            const [currentCabinetIdx, setCurrentCabinetIdx] = useState(0);
            const [activeJarId, setActiveJarId] = useState(null);

            // Cloud Sync Config
            const [userId, setUserId] = useState(() => localStorage.getItem('task_user_id') || '');
            const [dbUrl, setDbUrl] = useState(() => localStorage.getItem('task_db_url') || 'https://script.google.com/macros/s/AKfycbzGCeuJiAXRf5Z8ZWDiYM2pAkQq9E9z_C0yLMrmBU_hVYsJ7yqX2m4HXihigRJDWkXA/exec');
            const [syncStatus, setSyncStatus] = useState('idle');
            const [syncErrorMsg, setSyncErrorMsg] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            const [loadingText, setLoadingText] = useState('');

            // Edit & Social
            const [isEditingCabinet, setIsEditingCabinet] = useState(false);
            const [editCabinetData, setEditCabinetData] = useState({ name: '', reward: '' });
            const [isEditingJarName, setIsEditingJarName] = useState(false);
            const [editJarName, setEditJarName] = useState('');
            const [editTaskId, setEditTaskId] = useState(null);
            const [friends, setFriends] = useState([]);
            const [sharedJars, setSharedJars] = useState([]);
            const [activeChatFriend, setActiveChatFriend] = useState(null);
            const [addFriendInput, setAddFriendInput] = useState('');
            const [showShareModal, setShowShareModal] = useState(false);
            const [jarToShare, setJarToShare] = useState(null);
            const [friendSearchStatus, setFriendSearchStatus] = useState('idle');
            const [foundFriendId, setFoundFriendId] = useState(null);

            // Toasts
            const [toasts, setToasts] = useState([]);
            const addToast = (msg, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            // UI State
            const [showCabinetWizard, setShowCabinetWizard] = useState(false);
            const [showJarWizard, setShowJarWizard] = useState(false);
            const [showAddTaskModal, setShowAddTaskModal] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [bottomTab, setBottomTab] = useState('home');

            useEffect(() => { localStorage.setItem('task_user_id', userId); }, [userId]);
            useEffect(() => { localStorage.setItem('task_db_url', dbUrl); }, [dbUrl]);

            const isValidScriptUrl = (url) => url && url.includes('script.google.com');

            const debouncedSync = useCallback(() => {
                if (!dbUrl || !userId || cabinets.length === 0) return;
                if (!isValidScriptUrl(dbUrl)) { setSyncStatus('error'); return; }
                setSyncStatus('syncing');
                api.post(dbUrl, 'sync_personal', { userId, data: cabinets })
                    .then(() => { setSyncStatus('success'); setTimeout(() => setSyncStatus('idle'), 2000); })
                    .catch(() => setSyncStatus('error'));
            }, [cabinets, dbUrl, userId]);

            useEffect(() => { const t = setTimeout(debouncedSync, 2000); return () => clearTimeout(t); }, [debouncedSync]);

            // Data Loaders
            const loadFriends = async () => {
                try {
                    const res = await api.get(dbUrl, 'get_friends', { userId });
                    if (res.result === 'success') setFriends(res.friends || []);
                } catch(e) {}
            };
            const loadSharedJars = async () => {
                try {
                    const res = await api.get(dbUrl, 'get_shared_jars', { userId });
                    if (res.result === 'success') setSharedJars(res.jars || []);
                } catch(e) {}
            };

            // V7.0 NEW: Merge Shared Data Logic
            useEffect(() => {
                if (sharedJars.length > 0 && cabinets.length > 0) {
                    setCabinets(prevCabinets => {
                        const newCabinets = [...prevCabinets];
                        let hasChanges = false;
                        newCabinets.forEach(cab => {
                            cab.jars = cab.jars.map(jar => {
                                const sharedVer = sharedJars.find(s => s.jarId === jar.id);
                                if (sharedVer) {
                                    // Deep check to prevent infinite loop
                                    const tasksChanged = JSON.stringify(jar.tasks) !== JSON.stringify(sharedVer.data.tasks);
                                    const sharedStateChanged = !jar.isShared;
                                    
                                    if (tasksChanged || sharedStateChanged) {
                                        hasChanges = true;
                                        // Merge: Use shared tasks as source of truth, mark as shared, update shared list
                                        return { 
                                            ...jar, 
                                            tasks: sharedVer.data.tasks, 
                                            isShared: true, 
                                            sharedWith: sharedVer.sharedWith 
                                        };
                                    }
                                }
                                return jar;
                            });
                        });
                        return hasChanges ? newCabinets : prevCabinets;
                    });
                }
            }, [sharedJars]); // Trigger merge when shared jars are fetched

            const handleLogin = async () => {
                setLoginLoading(true); setSyncErrorMsg('');
                if (dbUrl && userId && isValidScriptUrl(dbUrl)) {
                    try {
                        setLoadingText('連線中...');
                        const res = await api.get(dbUrl, 'get_personal', { userId });
                        if (res.result === 'success') {
                            if (res.data) {
                                setLoadingText('載入資料...');
                                setCabinets(res.data);
                                setView('dashboard');
                            } else {
                                setLoadingText('建立帳號...');

                                await api.post(dbUrl, 'sync_personal', { userId, data: initData });

                            }
                            loadFriends();
                            loadSharedJars();
                        } else throw new Error(res.error);
                    } catch (e) { setSyncErrorMsg("連線失敗，使用離線模式"); setView(localStorage.getItem('has_onboarded') ? 'dashboard' : 'onboarding'); }
                } else setView(localStorage.getItem('has_onboarded') ? 'dashboard' : 'onboarding');
                setLoginLoading(false);
            };

            const handleSearchFriend = async () => {
                if (!addFriendInput) return;
                setFriendSearchStatus('searching');
                try {
                    const res = await api.get(dbUrl, 'get_personal', { userId: addFriendInput });
                    if (res.result === 'success') { // Assuming valid user if get_personal succeeds
                         setFriendSearchStatus('found'); setFoundFriendId(addFriendInput);
                    } else { setFriendSearchStatus('not-found'); }
                } catch (e) { setFriendSearchStatus('error'); }
            };

            const handleAddFriend = async () => {
                if (friendSearchStatus !== 'found' || !foundFriendId) return;
                try {
                    await api.post(dbUrl, 'add_friend', { userId, friendId: foundFriendId });
                    setAddFriendInput('');
                    setFriendSearchStatus('idle');
                    addToast(`成功加入好友：${foundFriendId}`, 'success');
                    loadFriends();
                } catch(e) { addToast("加好友失敗"); }
            };

            const handleShareJar = async (jarId, targetUserIds) => {
                const cabinetIdx = cabinets.findIndex(c => c.jars.some(j => j.id === jarId));
                if (cabinetIdx === -1) return;
                const jar = cabinets[cabinetIdx].jars.find(j => j.id === jarId);
                
                const updatedCabinets = [...cabinets];
                const jarToUpdate = updatedCabinets[cabinetIdx].jars.find(j => j.id === jarId);
                jarToUpdate.isShared = true;
                jarToUpdate.sharedWith = targetUserIds;
                setCabinets(updatedCabinets);

                try {
                    await api.post(dbUrl, 'share_jar', { userId, jarId, targetUserIds: JSON.stringify(targetUserIds), jarData: jar });
                    setShowShareModal(false);
                    addToast("共享成功！", 'success');
                    loadSharedJars();
                } catch(e) { addToast("共享失敗"); }
            };

            const openShareModal = (jar) => { setJarToShare(jar); setShowShareModal(true); };

            const handleCreateJar = async (data) => {
                const newJar = { 
                    id: generateId(), 
                    name: data.name, 
                    type: data.type, 
                    mode: data.mode, 
                    tasks: [], 
                    isShared: data.sharedWith && data.sharedWith.length > 0,
                    sharedWith: data.sharedWith || []
                };
                const updated = [...cabinets];
                updated[currentCabinetIdx].jars.push(newJar);
                setCabinets(updated);
                
                if (data.sharedWith && data.sharedWith.length > 0) {
                    await api.post(dbUrl, 'share_jar', { userId, jarId: newJar.id, targetUserIds: JSON.stringify(data.sharedWith), jarData: newJar });
                    addToast(`已建立並共享給 ${data.sharedWith.length} 位好友`, 'success');
                } else {
                    addToast("新罐子建立成功！", 'success');
                }
            };

            // Shared Jar Handlers
            const handleUpdateSharedJar = async (jarId, updatedJarData) => {
                // 1. Optimistic Update Shared View
                setSharedJars(prev => prev.map(s => s.jarId === jarId ? { ...s, data: updatedJarData } : s));
                
                // 2. Optimistic Update Personal View (if it exists locally)
                setCabinets(prev => {
                    const newCabs = [...prev];
                    let changed = false;
                    newCabs.forEach(c => {
                        const jIdx = c.jars.findIndex(j => j.id === jarId);
                        if (jIdx !== -1) {
                             c.jars[jIdx] = { ...c.jars[jIdx], ...updatedJarData, isShared: true };
                             changed = true;
                        }
                    });
                    return changed ? newCabs : prev;
                });

                // 3. Sync to Backend
                const sharedJarMeta = sharedJars.find(s => s.jarId === jarId) || cabinets.flatMap(c=>c.jars).find(j=>j.id===jarId); // Find meta from either source
                // Note: If updating from Personal, 'sharedJarMeta' might be missing 'ownerId' if not found in sharedJars list.
                // We need to know ownerId to update shared jar.
                // If I am owner (in Personal View), ownerId is userId.
                // If I am viewer (in Shared View), ownerId is sharedJarMeta.ownerId.
                
                const ownerId = (activeJarType === 'personal') ? userId : sharedJarMeta?.ownerId;
                const sharedWith = (activeJarType === 'personal') ? sharedJarMeta?.sharedWith : sharedJarMeta?.sharedWith;

                if (ownerId) {
                    try { 
                        await api.post(dbUrl, 'share_jar', { 
                            userId: ownerId, 
                            jarId, 
                            targetUserIds: JSON.stringify(sharedWith || []), 
                            jarData: updatedJarData 
                        }); 
                    } catch(e){}
                }
            };

            const handleAddTaskToShared = (jarId, data) => {
                let jarData;
                if (activeJarType === 'personal') {
                    jarData = cabinets[currentCabinetIdx].jars.find(j => j.id === jarId);
                } else {
                    jarData = sharedJars.find(s => s.jarId === jarId)?.data;
                }
                
                if (jarData) {
                    const updatedJar = { ...jarData };
                    if (!updatedJar.tasks) updatedJar.tasks = [];
                    updatedJar.tasks.push({ id: generateId(), ...data, completed: false });
                    handleUpdateSharedJar(jarId, updatedJar);
                    setShowAddTaskModal(false);
                }
            };

            const toggleSharedTaskComplete = (jarId, taskId) => {
                let jarData;
                if (activeJarType === 'personal') {
                    jarData = cabinets[currentCabinetIdx].jars.find(j => j.id === jarId);
                } else {
                    jarData = sharedJars.find(s => s.jarId === jarId)?.data;
                }

                if (jarData) {
                    const updatedJar = { ...jarData };
                    // Creating deep copy of tasks array to avoid mutation issues
                    updatedJar.tasks = updatedJar.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t);
                    
                    if (updatedJar.tasks.every(t => t.completed)) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    handleUpdateSharedJar(jarId, updatedJar);
                }
            };

            // Common Handlers
            const handleTabChange = (tab) => { setBottomTab(tab); setActiveJarId(null); };
            const handleOnboardingComplete = () => { localStorage.setItem('has_onboarded', 'true'); const d = [{ id: generateId(), name: "目標", reward: "獎勵", jars: [] }]; setCabinets(d); if(dbUrl&&userId) api.post(dbUrl, 'sync_personal', {userId, data: d}); setView('dashboard'); };
            const handleCreateCabinet = (data) => { setCabinets([...cabinets, { id: generateId(), name: data.name, reward: data.reward, deadline: data.deadline, jars: [] }]); setCurrentCabinetIdx(cabinets.length); };
            const handleUpdateCabinet = () => { const u = [...cabinets]; u[currentCabinetIdx].name = editCabinetData.name; u[currentCabinetIdx].reward = editCabinetData.reward; setCabinets(u); setIsEditingCabinet(false); };
            const handleUpdateJarName = () => { const u = [...cabinets]; u[currentCabinetIdx].jars.find(j=>j.id===activeJarId).name = editJarName; setCabinets(u); setIsEditingJarName(false); };
            
            const handleAddTask = (data) => { 
                // Check if current jar is shared
                const jar = cabinets[currentCabinetIdx].jars.find(j=>j.id===activeJarId);
                if (activeJarType === 'personal' && !jar?.isShared) {
                    const u = [...cabinets]; 
                    u[currentCabinetIdx].jars.find(j=>j.id===activeJarId).tasks.push({id:generateId(), ...data, completed:false}); 
                    setCabinets(u); 
                    setShowAddTaskModal(false); 
                } else { 
                    // It's a shared jar (either in personal view or shared view)
                    handleAddTaskToShared(activeJarId, data); 
                }
            };
            
            const toggleTaskComplete = (tid) => { 
                const jar = cabinets[currentCabinetIdx]?.jars.find(j=>j.id===activeJarId);
                if (activeJarType === 'personal' && !jar?.isShared) {
                    const u = [...cabinets]; 
                    const j = u[currentCabinetIdx].jars.find(j=>j.id===activeJarId); 
                    const t = j.tasks.find(x=>x.id===tid); 
                    if(t){ t.completed = !t.completed; if(j.tasks.every(x=>x.completed)) confetti({particleCount:100, spread:70, origin:{y:0.6}}); } 
                    setCabinets(u); 
                } else { 
                    toggleSharedTaskComplete(activeJarId, tid); 
                }
            };
            
            const handleUpdateTask = (tid, d) => { 
                 const jar = cabinets[currentCabinetIdx]?.jars.find(j=>j.id===activeJarId);
                if (activeJarType === 'personal' && !jar?.isShared) {
                    const u = [...cabinets]; 
                    const j = u[currentCabinetIdx].jars.find(j=>j.id===activeJarId); 
                    const t = j.tasks.findIndex(x=>x.id===tid); 
                    if(t!==-1) j.tasks[t] = {...j.tasks[t], ...d}; 
                    setCabinets(u); 
                } else {
                     // TODO: Add shared task update logic (Update whole jar)
                     // Simplified: Just update locally for now, robust shared update needs full jar rewrite
                     // For V7, let's just allow local update for simplicity or implement full update
                     const u = [...cabinets]; 
                     const j = u[currentCabinetIdx].jars.find(j=>j.id===activeJarId); 
                     const t = j.tasks.findIndex(x=>x.id===tid); 
                     if(t!==-1) j.tasks[t] = {...j.tasks[t], ...d}; 
                     // If shared, push update
                     if(jar?.isShared) handleUpdateSharedJar(activeJarId, j);
                     else setCabinets(u);
                }
                setEditTaskId(null); 
            };

            const openJar = (jarId, type) => { setActiveJarId(jarId); setActiveJarType(type); };
            const startEditingCabinet = () => { setEditCabinetData({ name: cabinets[currentCabinetIdx].name, reward: cabinets[currentCabinetIdx].reward }); setIsEditingCabinet(true); };

            // Login View
            if (view === 'login') return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 relative">
                    <div className="glass-panel rounded-3xl p-10 w-full max-w-sm shadow-2xl text-center space-y-8 animate-float-in relative z-10">
                        <div className="w-40 h-40 mx-auto flex items-center justify-center relative"><img src={APP_ICON_URL} alt="致理 Logo" className="w-full h-full object-contain drop-shadow-xl hover:scale-105 transition-transform duration-500" onError={(e) => { e.target.style.display = 'none'; document.getElementById('logo-fallback').style.display = 'flex'; }} /><div id="logo-fallback" className="hidden absolute inset-0 w-full h-full bg-white/80 rounded-full border-4 border-brand-500 flex items-center justify-center shadow-inner backdrop-blur-md"><span className="text-brand-600 font-black text-4xl tracking-tighter">CLUT</span></div></div>
                        <div><h1 className="text-4xl font-black text-ink tracking-tight">任務罐</h1><p className="text-slate-500 font-medium tracking-wide text-sm uppercase">Chihlee Task Jar v6.9.2</p></div>
                        <div className="space-y-4 text-left">
                            <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">使用者 ID</label><input className="w-full border-2 border-white/50 rounded-xl p-3 text-sm mt-1 focus:outline-none focus:border-brand-500 bg-white/50 backdrop-blur-sm" placeholder="例如：student123" value={userId} onChange={e => setUserId(e.target.value)} /></div>
                            <div><label className="text-xs font-bold text-slate-500 uppercase flex items-center gap-1 ml-1"><Icons.Link className="w-3 h-3"/> 資料庫網址 (Google Script)</label><input className="w-full border-2 border-white/50 rounded-xl p-3 text-sm mt-1 focus:outline-none focus:border-brand-500 bg-white/50 backdrop-blur-sm" value={dbUrl} onChange={e => setDbUrl(e.target.value)} /></div>
                            {syncErrorMsg && <div className="text-xs text-amber-600 bg-amber-50/80 p-3 rounded-xl flex items-center gap-2 border border-amber-100 font-medium backdrop-blur-sm"><Icons.AlertTriangle className="w-4 h-4 flex-shrink-0" /> {syncErrorMsg}</div>}
                        </div>
                        <button onClick={handleLogin} disabled={!userId || loginLoading} className="w-full bg-gradient-to-r from-brand-600 to-brand-500 text-white font-bold py-4 rounded-xl hover:shadow-lg transition-all shadow-md flex justify-center items-center gap-2 text-lg tracking-wide">{loginLoading && <Icons.Loader className="w-5 h-5 animate-spin"/>}{loginLoading ? "連線中..." : "開始旅程"}</button>
                    </div>
                </div>
            );

            if (view === 'onboarding') return (
                <div className="flex flex-col h-screen"><header className="glass-panel p-4 shadow-sm text-center font-bold text-lg text-brand-600 tracking-widest uppercase z-10 m-4 rounded-2xl">WELCOME</header><div className="flex-1 p-4 space-y-4"><div className="flex items-start"><div className="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center mr-3 text-2xl shadow-md text-white">🤖</div><div className="glass-panel p-5 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-slate-700 font-medium leading-relaxed bg-white/60">嗨！歡迎來到致理任務罐。</div></div></div><div className="p-4"><button onClick={handleOnboardingComplete} className="w-full bg-brand-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-brand-500 transition-colors">建立我的檔案</button></div></div>
            );

            // Jar Detail View
            if (activeJarId) {
                let currentJar;
                if (activeJarType === 'personal') {
                    currentJar = cabinets[currentCabinetIdx].jars.find(j => j.id === activeJarId);
                } else {
                    const sharedItem = sharedJars.find(s => s.jarId === activeJarId);
                    currentJar = sharedItem ? sharedItem.data : null;
                }

                if (!currentJar) return <div className="fixed inset-0 z-40 flex items-center justify-center">Loading or not found... <button onClick={() => setActiveJarId(null)}>Close</button></div>;

                const startEditingJar = () => { setEditJarName(currentJar.name); setIsEditingJarName(true); };
                const startEditingTask = (task) => { setEditTaskId(task.id); };

                return (
                    <div className="fixed inset-0 z-40 bg-slate-100/60 backdrop-blur-xl flex flex-col animate-float-in">
                        <div className="bg-white/40 p-4 shadow-sm flex items-center justify-between border-b border-white/20 backdrop-blur-md">
                            <button onClick={() => setActiveJarId(null)} className="text-slate-500 hover:text-brand-600 p-2 -ml-2 transition-colors"><Icons.ChevronLeft className="w-7 h-7" /></button>
                            {isEditingJarName ? (<div className="flex items-center gap-2"><input className="border-b-2 border-brand-500 text-center font-bold text-xl outline-none w-40 bg-transparent text-ink" value={editJarName} onChange={e => setEditJarName(e.target.value)} autoFocus /><button onClick={handleUpdateJarName} className="bg-green-100 text-green-600 p-1.5 rounded-full hover:bg-green-200"><Icons.Save className="w-5 h-5" /></button></div>) : (<div className="text-center flex items-center justify-center gap-2 group"><div><h2 className="font-bold text-xl text-ink tracking-tight">{currentJar.name}</h2><span className="text-[10px] font-bold text-brand-600 px-2 py-0.5 bg-brand-50/50 rounded-full uppercase tracking-wider">{currentJar.mode} {activeJarType === 'shared' && '(共享)'}</span></div><button onClick={startEditingJar} className="text-slate-300 hover:text-brand-500 opacity-0 group-hover:opacity-100 transition-all"><Icons.Edit className="w-4 h-4" /></button></div>)}<div className="w-8"></div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {(!currentJar.tasks || currentJar.tasks.length === 0) ? <div className="h-full flex flex-col items-center justify-center text-slate-400 gap-4"><div className="w-24 h-24 bg-white/50 rounded-full flex items-center justify-center backdrop-blur-sm"><Icons.JarEmpty className="w-12 h-12 opacity-30" /></div><p className="font-medium">這裡空空如也</p><p className="text-sm bg-white/50 px-3 py-1 rounded-full shadow-sm backdrop-blur-sm">點擊右下角 + 開始放入任務</p></div> : 
                            currentJar.tasks.map(t => (
                                <div key={t.id} className={`p-5 rounded-2xl border flex items-center gap-4 transition-all duration-300 group ${t.completed ? 'bg-slate-50/50 border-transparent opacity-60' : 'glass-panel border-white/60 hover:scale-[1.02]'}`}>
                                    {editTaskId === t.id ? (
                                        <div className="flex-1 flex flex-col gap-3 animate-float-in"><input className="border-2 border-brand-200 rounded-lg p-2 text-sm focus:outline-none focus:border-brand-500 font-bold text-ink bg-white/80" defaultValue={t.name} id={`edit-name-${t.id}`} autoFocus />{currentJar.mode === '複雜罐' && (<div className="flex gap-2"><input type="time" className="border-2 border-slate-200 rounded-lg p-2 text-xs bg-white/50" defaultValue={t.time} id={`edit-time-${t.id}`} /><input className="border-2 border-slate-200 rounded-lg p-2 text-xs flex-1 bg-white/50" defaultValue={t.desc} placeholder="備註" id={`edit-desc-${t.id}`} /></div>)}<div className="flex justify-end gap-3 mt-1"><button onClick={() => setEditTaskId(null)} className="text-xs bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold">取消</button><button onClick={() => { const name = document.getElementById(`edit-name-${t.id}`).value; const time = document.getElementById(`edit-time-${t.id}`)?.value; const desc = document.getElementById(`edit-desc-${t.id}`)?.value; handleUpdateTask(t.id, {name, time, desc}); }} className="text-xs bg-brand-500 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-brand-600 shadow-sm">儲存修改</button></div></div>
                                    ) : (
                                        <>
                                            <div onClick={() => toggleTaskComplete(t.id)} className={`w-7 h-7 rounded-full border-2 flex items-center justify-center cursor-pointer transition-colors flex-shrink-0 ${t.completed ? 'bg-green-500 border-green-500' : 'border-slate-400 hover:border-brand-400 bg-white/50'}`}>{t.completed && <Icons.Plus className="w-4 h-4 text-white rotate-45" />}</div>
                                            <div onClick={() => toggleTaskComplete(t.id)} className="flex-1 cursor-pointer"><h3 className={`font-bold text-base transition-colors ${t.completed ? 'text-slate-400 line-through decoration-2' : 'text-ink'}`}>{t.name}</h3>{(t.time || t.desc) && (<div className="flex flex-wrap gap-2 mt-1">{t.time && <span className="text-[10px] bg-blue-50/80 text-blue-600 px-2 py-0.5 rounded font-bold">🕒 {t.time}</span>}{t.desc && <span className="text-[10px] text-slate-500">{t.desc}</span>}</div>)}</div>
                                            <button onClick={() => startEditingTask(t)} className="text-slate-300 hover:text-brand-500 p-2 opacity-0 group-hover:opacity-100 transition-all"><Icons.Edit className="w-4 h-4" /></button>
                                        </>
                                    )}
                                </div>
                            ))}
                            <button onClick={() => setShowAddTaskModal(true)} className="absolute bottom-8 right-6 w-16 h-16 bg-brand-600 text-white rounded-full shadow-lg flex items-center justify-center hover:scale-110 active:scale-95 transition-all hover:bg-brand-500"><Icons.Plus className="w-8 h-8" /></button>
                        </div>
                        {showAddTaskModal && <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4 animate-float-in" onClick={() => setShowAddTaskModal(false)}><div className="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl bg-white/90" onClick={e => e.stopPropagation()}><h3 className="font-bold text-xl mb-6 text-ink">放入新任務</h3><form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); handleAddTask({ name: fd.get('name'), time: fd.get('time') }); }}><div className="space-y-5"><div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">任務名稱</label><input name="name" required className="w-full border-2 border-slate-200 rounded-xl p-3 text-lg font-bold text-ink focus:outline-none focus:border-brand-500 bg-white/50" autoFocus placeholder="例如：讀書 30 分鐘" /></div>{currentJar?.mode === '複雜罐' && <div><label className="block text-xs font-bold text-slate-400 uppercase mb-1">時間</label><input name="time" type="time" className="w-full border-2 border-slate-200 rounded-xl p-3 text-ink focus:outline-none focus:border-brand-500 bg-white/50" /></div>}</div><button className="w-full bg-brand-600 text-white font-bold py-4 rounded-xl mt-8 hover:bg-brand-500 shadow-lg transition-all active:scale-95">放入罐子</button></form></div></div>}
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen relative">
                    <ToastContainer toasts={toasts} />
                    
                    <header className="glass-panel p-4 flex justify-between items-center shadow-sm z-10 m-2 rounded-2xl">
                        <button onClick={() => setIsSidebarOpen(true)} className="p-2 -ml-2 text-slate-600 hover:bg-white/50 rounded-full transition-colors"><Icons.Menu className="w-6 h-6" /></button>
                        <div className="flex flex-col items-center">
                            <h1 className="font-black text-lg text-ink tracking-tight">{bottomTab === 'home' && '個人任務櫃'} {bottomTab === 'history' && '歷史紀錄'} {bottomTab === 'shared' && '共享中心'} {bottomTab === 'chat' && '聊天室'} {bottomTab === 'ai' && 'AI 助手'}</h1>
                            {dbUrl && <div className="flex items-center gap-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{syncStatus === 'syncing' && <><Icons.Cloud className="w-3 h-3 animate-pulse text-brand-400" /> 同步中...</>}{syncStatus === 'success' && <><Icons.CloudCheck className="w-3 h-3 text-green-500" /> 已同步</>}{syncStatus === 'error' && <><Icons.CloudOff className="w-3 h-3 text-red-500" /> 同步失敗</>}{syncStatus === 'idle' && <><Icons.CloudCheck className="w-3 h-3" /> 就緒</>}</div>}
                        </div>
                        <button className="p-2 -mr-2 text-slate-600 hover:bg-white/50 rounded-full transition-colors"><Icons.Wrench className="w-6 h-6" /></button>
                    </header>

                    {isSidebarOpen && <div className="absolute inset-0 z-50 bg-black/20 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}><div className="w-72 h-full glass-panel p-8 shadow-2xl animate-float-in bg-white/90" onClick={e => e.stopPropagation()}><h2 className="text-2xl font-black mb-8 text-brand-600">MENU</h2><ul className="space-y-6 text-slate-600 font-bold text-lg"><li>使用者: <span className="font-normal text-base block text-slate-400">{userId}</span></li><li onClick={debouncedSync} className="cursor-pointer hover:text-brand-600 flex items-center gap-3 transition-colors"><Icons.RefreshCw className="w-5 h-5"/> 強制同步</li><li onClick={() => { localStorage.clear(); location.reload(); }} className="text-red-500 cursor-pointer hover:text-red-600 transition-colors mt-8 pt-8 border-t border-slate-200">登出帳號</li></ul></div></div>}

                    {/* Modals & Overlays */}
                    {activeChatFriend && <ChatRoomComp me={userId} friendId={activeChatFriend} dbUrl={dbUrl} onClose={() => setActiveChatFriend(null)} />}
                    <ShareJarModal isOpen={showShareModal} onClose={() => setShowShareModal(false)} jar={jarToShare} friends={friends} onShare={handleShareJar} />
                    <NPCWizard isOpen={showCabinetWizard} onClose={() => setShowCabinetWizard(false)} steps={[{key:'name', question:'櫃子名稱?', type:'text'}, {key:'reward', question:'獎勵?', type:'text'}]} onComplete={handleCreateCabinet} title="新目標" />
                    
                    {/* Updated Jar Wizard with Sharing Step */}
                    <NPCWizard 
                        isOpen={showJarWizard} 
                        onClose={() => setShowJarWizard(false)} 
                        friends={friends}
                        steps={[
                            {key:'name', question:'罐子名稱?', type:'text'}, 
                            {key:'type', question:'類型?', type:'select', options:['生活','學習','運動','娛樂']},
                            {key:'mode', question:'模式?', type:'select', options:['簡單罐 (僅打勾)','複雜罐 (需時間)']},
                            {key:'sharedWith', question:'是否與好友共享?', type:'multi-friend'}
                        ]} 
                        onComplete={handleCreateJar} 
                        title="新增任務罐" 
                    />

                    {/* Main Content */}
                    {bottomTab === 'home' && <HomeTabComp 
                        cabinets={cabinets} 
                        currentCabinetIdx={currentCabinetIdx}
                        isEditingCabinet={isEditingCabinet}
                        startEditingCabinet={startEditingCabinet}
                        editCabinetData={editCabinetData}
                        setEditCabinetData={setEditCabinetData}
                        handleUpdateCabinet={handleUpdateCabinet}
                        setIsEditingCabinet={setIsEditingCabinet}
                        setCurrentCabinetIdx={setCurrentCabinetIdx}
                        setActiveJarId={setActiveJarId}
                        openShareModal={openShareModal}
                        setShowJarWizard={setShowJarWizard}
                        setShowCabinetWizard={setShowCabinetWizard}
                    />}
                    {bottomTab === 'history' && <HistoryTabComp cabinets={cabinets} />}
                    {bottomTab === 'shared' && <SharedTabComp sharedJars={sharedJars} openJar={openJar} />}
                    {bottomTab === 'chat' && <ChatTabComp 
                        addFriendInput={addFriendInput} 
                        setAddFriendInput={setAddFriendInput} 
                        handleSearchFriend={handleSearchFriend}
                        friendSearchStatus={friendSearchStatus}
                        foundFriendId={foundFriendId}
                        handleAddFriend={handleAddFriend}
                        friends={friends}
                        setActiveChatFriend={setActiveChatFriend}
                    />}
                    {bottomTab === 'ai' && <AIChatTabComp />}

                    <div className="glass-panel m-2 mb-4 px-6 py-2 pb-2 flex justify-between items-center text-xs font-bold text-slate-400 z-10 rounded-2xl">
                        <button onClick={() => handleTabChange('history')} className={`flex flex-col items-center gap-1.5 p-2 rounded-xl transition-colors ${bottomTab === 'history' ? 'text-brand-600 bg-brand-50/50' : 'hover:text-slate-600'}`}><Icons.History className="w-6 h-6" />紀錄</button>
                        <button onClick={() => handleTabChange('shared')} className={`flex flex-col items-center gap-1.5 p-2 rounded-xl transition-colors ${bottomTab === 'shared' ? 'text-brand-600 bg-brand-50/50' : 'hover:text-slate-600'}`}><Icons.Users className="w-6 h-6" />共享</button>
                        <div className="relative -top-6"><button onClick={() => handleTabChange('home')} className="bg-gradient-to-br from-brand-500 to-brand-600 text-white p-4 rounded-full shadow-float hover:scale-110 active:scale-95 transition-all border-4 border-white/50"><Icons.Home className="w-7 h-7" /></button></div>
                        <button onClick={() => handleTabChange('chat')} className={`flex flex-col items-center gap-1.5 p-2 rounded-xl transition-colors ${bottomTab === 'chat' ? 'text-brand-600 bg-brand-50/50' : 'hover:text-slate-600'}`}>
                            <div className="relative"><Icons.MessageCircle className="w-6 h-6" />{/* Mock notification dot */}<div className="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border border-white"></div></div>好友
                        </button>
                        <button onClick={() => handleTabChange('ai')} className={`flex flex-col items-center gap-1.5 p-2 rounded-xl transition-colors ${bottomTab === 'ai' ? 'text-brand-600 bg-brand-50/50' : 'hover:text-slate-600'}`}><Icons.Bot className="w-6 h-6" />AI</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
