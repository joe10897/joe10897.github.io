<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任務罐APP_DEMOv2</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 載入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 載入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 載入 Canvas Confetti 用於慶祝動畫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 載入動畫 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        /* 天氣懸浮動畫 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        /* 任務罐液體動畫 */
        @keyframes wave {
            0% { background-position-x: 0; }
            100% { background-position-x: 100px; }
        }
        .liquid-wave {
            background: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.3),
                rgba(255,255,255,0.3) 10px,
                transparent 10px,
                transparent 20px
            );
            animation: wave 10s linear infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示組件 ---
        const Check = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const Plus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const CalendarIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        );
        const Sparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"></path></svg>
        );
        const Copy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        );
        const Loader2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
        );
        const Clock = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        );
        const Truck = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
        );
        const MapPin = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        );
        const CloudSun = ({ className }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>
        );
        const Battery = ({ className, level }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
                <line x1="23" y1="13" x2="23" y2="11"></line>
                <rect x="3" y="8" width={level * 0.14} height="8" rx="1" ry="1" fill="currentColor" stroke="none"></rect>
            </svg>
        );
        const Download = ({ className }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        );
        const Camera = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        );
        const Trophy = ({ className }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const ArrowLeft = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        );

        // --- 主程式邏輯 ---

        const PRESET_TASKS = [
            "拖地",
            "洗碗",
            "倒垃圾",
            "閱讀小說",
            "讀書",
            "運動",
            "買菜",
            "洗衣服",
            "寫程式",
            "整理房間"
        ];

        const MOCK_TRASH_DATA = {
            address: "陽明街23巷8弄20號",
            times: ["14:23", "19:30"],
            status: "暫無預估抵達時間",
            types: ["一般垃圾", "資源回收", "廚餘回收"],
            url: "https://crd-rubbish.epd.ntpc.gov.tw/dispPageBox/Ntpcepd/NtpMP.aspx?ddsPageID=MAP"
        };

        function getWeatherDescription(code) {
            if (code === 0) return "晴朗";
            if (code >= 1 && code <= 3) return "多雲";
            if (code >= 45 && code <= 48) return "有霧";
            if (code >= 51 && code <= 67) return "有雨";
            if (code >= 80 && code <= 82) return "陣雨";
            if (code >= 95) return "雷雨";
            return "陰天";
        }

        // 模擬 AI 學習的反饋 (Toast)
        const AI_FEEDBACKS = [
            "AI 紀錄：已更新您的偏好模型，您似乎喜歡在下午完成這類任務！",
            "AI 紀錄：任務完成效率極高，難度權重已調整。",
            "AI 紀錄：太棒了！系統已記錄這次的完成時間作為未來參考。",
            "AI 紀錄：已將此任務標記為「高成就感」項目。"
        ];

        function App() {
            // --- 狀態定義 ---
            // 模式: 'planning' (規劃中) 或 'executing' (執行中)
            const [mode, setMode] = useState('planning');
            
            const [selectedTasks, setSelectedTasks] = useState([]);
            const [customTask, setCustomTask] = useState("");
            const [customTasksList, setCustomTasksList] = useState([]);
            
            // API Key
            const [apiKey, setApiKey] = useState(() => {
                return localStorage.getItem("gemini_api_key_v2") || ""; 
            });
            const [energyLevel, setEnergyLevel] = useState(70);
            const [loading, setLoading] = useState(false);
            const [scheduleResult, setScheduleResult] = useState("");
            const [error, setError] = useState("");
            
            const [trashInfo, setTrashInfo] = useState(null);
            const [loadingTrash, setLoadingTrash] = useState(false);
            const [weather, setWeather] = useState(null);

            // 執行模式的狀態 (之前遺漏的部分，現在已補上)
            const [completedTasks, setCompletedTasks] = useState([]); 
            const [taskPhotos, setTaskPhotos] = useState({}); 
            const [showConfetti, setShowConfetti] = useState(false);
            const [toast, setToast] = useState(null); 

            // 1. 自動儲存 API Key (使用新的鍵名 v2)
            useEffect(() => {
                localStorage.setItem("gemini_api_key_v2", apiKey);
            }, [apiKey]);

            // 2. 初始載入：獲取天氣
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=25.0143&longitude=121.4672&current=temperature_2m,weather_code&timezone=Asia%2FTaipei");
                        const data = await res.json();
                        setWeather({
                            temp: data.current.temperature_2m,
                            desc: getWeatherDescription(data.current.weather_code)
                        });
                    } catch (e) {
                        console.error("天氣獲取失敗", e);
                    }
                };
                fetchWeather();
            }, []);

            useEffect(() => {
                if (selectedTasks.includes("倒垃圾")) {
                    if (!trashInfo && !loadingTrash) {
                        setLoadingTrash(true);
                        setTimeout(() => {
                            setTrashInfo(MOCK_TRASH_DATA);
                            setLoadingTrash(false);
                        }, 800);
                    }
                } else {
                    setTrashInfo(null);
                }
            }, [selectedTasks]);

            // Toast 自動消失
            useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            // --- 規劃模式邏輯 ---
            const toggleTask = (task) => {
                if (selectedTasks.includes(task)) {
                    setSelectedTasks(selectedTasks.filter(t => t !== task));
                } else {
                    setSelectedTasks([...selectedTasks, task]);
                }
            };

            const addCustomTask = (e) => {
                e.preventDefault();
                if (customTask.trim() && !customTasksList.includes(customTask) && !PRESET_TASKS.includes(customTask)) {
                    setCustomTasksList([...customTasksList, customTask.trim()]);
                    setSelectedTasks([...selectedTasks, customTask.trim()]);
                    setCustomTask("");
                }
            };

            const getEnergyDescription = (level) => {
                if (level < 30) return "疲憊 (安排輕鬆行程)";
                if (level < 70) return "正常 (標準行程)";
                return "精力充沛 (挑戰高效率)";
            };

            const generatePrompt = () => {
                const tasksString = selectedTasks.join(" ");
                if (!tasksString) return "";
                
                const now = new Date();
                const currentTime = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
                const energyDesc = getEnergyDescription(energyLevel);
                
                let prompt = `現在時間是 ${currentTime}。`;
                if (weather) prompt += ` 目前板橋天氣為${weather.desc}，氣溫 ${weather.temp}°C。`;
                prompt += ` 我目前的能量狀態是：${energyLevel}% (${energyDesc})。`;
                prompt += ` 我今天接下來要完成：${tasksString}。`;
                if (selectedTasks.includes("倒垃圾") && trashInfo) {
                    prompt += ` (注意：倒垃圾時間為 ${trashInfo.times.join(" 或 ")}，務必安排)`;
                }
                prompt += ` 請給我一份詳細的行程安排建議。`;
                return prompt;
            };

            const handleGenerateSchedule = async () => {
                const prompt = generatePrompt();
                if (!prompt) { setError("請至少選擇一項任務！"); return; }
                if (!apiKey) { setError("請輸入 API Key"); return; }

                setLoading(true);
                setError("");
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    setScheduleResult(data.candidates[0].content.parts[0].text);
                } catch (err) {
                    setError("生成失敗：" + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleStartMission = () => {
                if (!scheduleResult) {
                    setError("請先生成行程安排！");
                    return;
                }
                setMode('executing');
                setCompletedTasks([]);
                setTaskPhotos({});
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // --- 執行模式邏輯 ---
            
            // 處理照片上傳
            const handlePhotoUpload = (task, event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        setTaskPhotos(prev => ({ ...prev, [task]: e.target.result }));
                        completeTask(task);
                    };
                    reader.readAsDataURL(file);
                }
            };

            // 完成任務
            const completeTask = (task) => {
                if (!completedTasks.includes(task)) {
                    setCompletedTasks(prev => [...prev, task]);
                    
                    // 隨機 AI 反饋
                    const randomFeedback = AI_FEEDBACKS[Math.floor(Math.random() * AI_FEEDBACKS.length)];
                    setToast({ message: `${task} 完成！${randomFeedback}`, type: 'success' });
                    
                    // 檢查是否全部完成
                    if (completedTasks.length + 1 === selectedTasks.length) {
                        triggerCelebration();
                    }
                }
            };

            const triggerCelebration = () => {
                setShowConfetti(true);
                // 觸發 canvas confetti
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                const randomInRange = (min, max) => Math.random() * (max - min) + min;

                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }
                    const particleCount = 50 * (timeLeft / duration);
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            };

            const handleDownload = () => {
                if (!scheduleResult) return;
                const element = document.createElement("a");
                const file = new Blob([scheduleResult], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                element.download = `行程安排_${new Date().toISOString().slice(0,10)}.txt`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };
            
            const copyToClipboard = () => {
                const prompt = generatePrompt();
                if (!prompt) return;
                const textArea = document.createElement("textarea");
                textArea.value = prompt;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert("指令已複製！");
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            // 計算進度
            const progressPercentage = Math.round((completedTasks.length / selectedTasks.length) * 100) || 0;

            // --- 渲染 ---

            return (
                <div className="text-slate-800 font-sans selection:bg-indigo-100 p-4 md:p-8 min-h-screen relative overflow-x-hidden">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 animate-float">
                            <div className="bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg flex items-center">
                                <Sparkles className="w-5 h-5 text-yellow-400 mr-2" />
                                <span className="text-sm font-medium">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto space-y-8">
                        
                        {/* Header */}
                        <header className="text-center space-y-2 relative">
                            {weather && (
                                <div className="absolute top-0 right-0 md:right-10 hidden md:flex items-center bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm border border-blue-200">
                                    <CloudSun className="w-5 h-5 mr-1.5" />
                                    <span>板橋 {weather.temp}°C {weather.desc}</span>
                                </div>
                            )}

                            <div className="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm mb-2">
                                <CalendarIcon className="w-8 h-8 text-indigo-600 mr-2" />
                                <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                                    任務罐APP_DEMOv2
                                </h1>
                            </div>
                            <p className="text-slate-500 font-medium">
                                {mode === 'planning' ? "遊戲化你的生活，從規劃開始！" : "執行任務，集滿能量罐！"}
                            </p>
                        </header>

                        {/* MODE: PLANNING (規劃模式) */}
                        {mode === 'planning' && (
                            <div className="grid md:grid-cols-2 gap-6 animate-[fadeIn_0.5s_ease-in]">
                                
                                {/* 左側：選擇區 */}
                                <div className="space-y-6">
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h2 className="text-lg font-semibold mb-4 flex items-center">
                                            <span className="w-1 h-6 bg-indigo-500 rounded-full mr-2"></span>
                                            選擇今日任務
                                        </h2>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                            {PRESET_TASKS.map((task) => (
                                                <button
                                                    key={task}
                                                    onClick={() => toggleTask(task)}
                                                    className={`relative p-3 rounded-xl text-sm font-medium transition-all duration-200 border text-left flex items-start justify-between group ${selectedTasks.includes(task) ? 'bg-indigo-600 text-white border-indigo-600 shadow-md transform scale-[1.02]' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50'}`}
                                                >
                                                    {task}
                                                    {selectedTasks.includes(task) && <Check className="w-4 h-4 ml-1" />}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 垃圾車資訊 */}
                                    {selectedTasks.includes("倒垃圾") && (
                                        <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 shadow-sm border border-amber-100 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-2 opacity-10"><Truck className="w-24 h-24 text-amber-600" /></div>
                                            <h3 className="text-amber-800 font-bold flex items-center mb-3">
                                                <Truck className="w-5 h-5 mr-2" /> 清運資訊
                                            </h3>
                                            {loadingTrash ? (
                                                <div className="flex items-center justify-center py-4 text-amber-600"><Loader2 className="w-6 h-6 animate-spin mr-2" />查詢中...</div>
                                            ) : trashInfo && (
                                                <div className="text-sm space-y-3 relative z-10">
                                                    <div className="flex items-start">
                                                        <MapPin className="w-4 h-4 text-amber-600 mt-1 mr-2" />
                                                        <div className="font-semibold text-slate-700">{trashInfo.address}</div>
                                                    </div>
                                                    <div className="bg-white/60 rounded-lg p-3 border border-amber-100 flex justify-between items-center">
                                                        <span className="text-slate-500 text-xs">時間</span>
                                                        <div className="flex gap-2">{trashInfo.times.map(t => <span key={t} className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold text-xs">{t}</span>)}</div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* 能量滑桿 */}
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h2 className="text-lg font-semibold mb-4 flex items-center">
                                            <span className="w-1 h-6 bg-pink-500 rounded-full mr-2"></span>
                                            目前能量狀態
                                        </h2>
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-end">
                                                <div className="flex items-center gap-2">
                                                    <Battery className={`w-6 h-6 ${energyLevel > 50 ? 'text-green-500' : 'text-orange-500'}`} level={energyLevel} />
                                                    <span className="font-bold text-2xl text-slate-700">{energyLevel}%</span>
                                                </div>
                                                <span className="text-sm font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded">{getEnergyDescription(energyLevel)}</span>
                                            </div>
                                            <input type="range" min="0" max="100" value={energyLevel} onChange={(e) => setEnergyLevel(e.target.value)} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                                        </div>
                                    </div>

                                    {/* 自訂任務 */}
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h2 className="text-lg font-semibold mb-4 flex items-center"><span className="w-1 h-6 bg-purple-500 rounded-full mr-2"></span>新增自訂事項</h2>
                                        <form onSubmit={addCustomTask} className="flex gap-2 mb-4">
                                            <input type="text" value={customTask} onChange={(e) => setCustomTask(e.target.value)} placeholder="例如：去郵局..." className="flex-1 px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-slate-50" />
                                            <button type="submit" disabled={!customTask.trim()} className="bg-purple-600 text-white p-2 rounded-xl hover:bg-purple-700 disabled:opacity-50"><Plus className="w-6 h-6" /></button>
                                        </form>
                                        {customTasksList.length > 0 && (
                                            <div className="flex flex-wrap gap-2">
                                                {customTasksList.map((task) => (
                                                    <button key={task} onClick={() => toggleTask(task)} className={`inline-flex items-center px-3 py-1.5 rounded-lg text-sm border ${selectedTasks.includes(task) ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}>
                                                        {task} {selectedTasks.includes(task) && <Check className="w-3 h-3 ml-1.5" />}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* API Key */}
                                    <div className="bg-white/50 rounded-xl p-4 border border-indigo-100">
                                        <label className="flex justify-between items-center text-xs font-semibold text-indigo-800 uppercase tracking-wide mb-2"><span>Gemini API Key</span><span className="text-[10px] text-green-600 bg-green-50 px-2 py-0.5 rounded border border-green-100">✓ 自動儲存中</span></label>
                                        <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="請在此貼上您的 Google Gemini API Key" className="w-full px-3 py-2 rounded-lg text-sm border border-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white/80" />
                                        <p className="text-xs text-slate-500 mt-1">
                                            * 原測試 Key 已失效，請至 <a href="https://aistudio.google.com/app/apikey" target="_blank" className="underline text-indigo-600">Google AI Studio</a> 申請免費 Key。
                                        </p>
                                    </div>
                                </div>

                                {/* 右側：生成結果 */}
                                <div className="flex flex-col h-full space-y-6">
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">操作面板</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={copyToClipboard} disabled={selectedTasks.length === 0} className="flex items-center justify-center gap-2 px-4 py-3 rounded-xl border-2 border-slate-200 text-slate-600 font-semibold hover:border-slate-300 transition-all disabled:opacity-50"><Copy className="w-5 h-5" />複製指令</button>
                                            <button onClick={handleGenerateSchedule} disabled={selectedTasks.length === 0 || loading} className="flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold hover:opacity-90 transition-all disabled:opacity-50 shadow-lg shadow-indigo-200">
                                                {loading ? <Loader2 className="w-5 h-5 animate-spin" /> : <Sparkles className="w-5 h-5" />} {loading ? "規劃中..." : "生成行程"}
                                            </button>
                                        </div>
                                        {error && <div className="mt-3 text-sm text-red-500 bg-red-50 px-3 py-2 rounded-lg border border-red-100">{error}</div>}
                                    </div>

                                    <div className="flex-1 bg-white rounded-2xl p-6 shadow-md border border-slate-100 min-h-[300px] flex flex-col relative overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-lg font-semibold flex items-center text-slate-800"><Clock className="w-5 h-5 mr-2 text-indigo-500" />建議行程表</h2>
                                            {scheduleResult && <button onClick={handleDownload} className="text-sm flex items-center text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded-lg border border-transparent hover:border-indigo-100 transition-colors"><Download className="w-4 h-4 mr-1.5" />下載</button>}
                                        </div>
                                        
                                        <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar mb-4">
                                            {scheduleResult ? (
                                                <div className="prose prose-slate prose-sm max-w-none whitespace-pre-wrap leading-relaxed">{scheduleResult}</div>
                                            ) : (
                                                <div className="h-full flex flex-col items-center justify-center text-slate-300 space-y-4">
                                                    <div className="w-16 h-16 rounded-full bg-slate-50 flex items-center justify-center"><CalendarIcon className="w-8 h-8" /></div>
                                                    <p>行程將會顯示在這裡</p>
                                                </div>
                                            )}
                                        </div>

                                        {/* 開始執行按鈕 (新功能入口) */}
                                        {scheduleResult && (
                                            <button 
                                                onClick={handleStartMission}
                                                className="w-full py-4 rounded-xl bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all flex items-center justify-center gap-2"
                                            >
                                                <Trophy className="w-6 h-6" />
                                                開始執行任務！(進入遊戲模式)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODE: EXECUTING (執行模式 - 遊戲化介面) */}
                        {mode === 'executing' && (
                            <div className="animate-[fadeIn_0.5s_ease-in] space-y-8">
                                
                                {/* 頂部導航 */}
                                <div className="flex justify-between items-center">
                                    <button onClick={() => setMode('planning')} className="flex items-center text-slate-500 hover:text-slate-800 transition-colors">
                                        <ArrowLeft className="w-5 h-5 mr-1" /> 返回規劃
                                    </button>
                                    <h2 className="text-xl font-bold text-slate-800">今日任務執行中</h2>
                                </div>

                                <div className="grid md:grid-cols-3 gap-8">
                                    
                                    {/* 左側：任務列表 */}
                                    <div className="md:col-span-2 space-y-4">
                                        {selectedTasks.map((task) => {
                                            const isCompleted = completedTasks.includes(task);
                                            return (
                                                <div key={task} className={`relative bg-white p-4 rounded-2xl border transition-all duration-300 ${isCompleted ? 'border-green-200 bg-green-50/50' : 'border-slate-100 shadow-sm hover:shadow-md'}`}>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${isCompleted ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                                {isCompleted ? <Check className="w-5 h-5" /> : <Clock className="w-5 h-5" />}
                                                            </div>
                                                            <div>
                                                                <h3 className={`font-bold text-lg ${isCompleted ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{task}</h3>
                                                                <p className="text-xs text-slate-500">{isCompleted ? '已完成並記錄' : '點擊相機上傳照片或直接打勾'}</p>
                                                            </div>
                                                        </div>

                                                        {!isCompleted && (
                                                            <div className="flex items-center gap-2">
                                                                <label className="cursor-pointer p-2 rounded-full hover:bg-indigo-50 text-indigo-500 transition-colors" title="上傳照片X1">
                                                                    <input type="file" accept="image/*" className="hidden" onChange={(e) => handlePhotoUpload(task, e)} />
                                                                    <Camera className="w-6 h-6" />
                                                                </label>
                                                                <button onClick={() => completeTask(task)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-sm">
                                                                    完成
                                                                </button>
                                                            </div>
                                                        )}
                                                        {isCompleted && taskPhotos[task] && (
                                                            <img src={taskPhotos[task]} alt="proof" className="w-12 h-12 object-cover rounded-lg border border-green-200" />
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        
                                        {/* 慶祝區塊 */}
                                        {showConfetti && (
                                            <div className="bg-gradient-to-r from-yellow-100 to-orange-100 p-6 rounded-2xl text-center border border-yellow-200 animate-[bounce_1s_infinite]">
                                                <h3 className="text-2xl font-bold text-orange-600 mb-2">🎉 恭喜！集滿任務罐！</h3>
                                                <p className="text-orange-800">你今天超級棒！快去查看你的照片回顧牆吧！</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* 右側：任務罐 (視覺化回饋) */}
                                    <div className="md:col-span-1">
                                        <div className="sticky top-8 bg-white rounded-3xl p-6 shadow-xl border border-slate-100 text-center">
                                            <h3 className="text-lg font-bold text-slate-700 mb-6 flex items-center justify-center gap-2">
                                                <Trophy className="w-6 h-6 text-yellow-500" /> 能量任務罐
                                            </h3>
                                            
                                            {/* 任務罐本體 */}
                                            <div className="w-32 h-48 mx-auto bg-slate-100 rounded-b-2xl rounded-t-md border-4 border-slate-300 relative overflow-hidden mb-6">
                                                {/* 刻度 */}
                                                <div className="absolute right-0 top-[25%] w-full h-[1px] bg-slate-300 opacity-50"><span className="absolute right-1 -top-2 text-[10px] text-slate-400">75%</span></div>
                                                <div className="absolute right-0 top-[50%] w-full h-[1px] bg-slate-300 opacity-50"><span className="absolute right-1 -top-2 text-[10px] text-slate-400">50%</span></div>
                                                <div className="absolute right-0 top-[75%] w-full h-[1px] bg-slate-300 opacity-50"><span className="absolute right-1 -top-2 text-[10px] text-slate-400">25%</span></div>
                                                
                                                {/* 液體 */}
                                                <div 
                                                    className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-indigo-500 to-purple-400 transition-all duration-1000 liquid-wave"
                                                    style={{ height: `${progressPercentage}%` }}
                                                ></div>
                                                
                                                {/* 星星糖果 (裝飾) */}
                                                {completedTasks.length > 0 && (
                                                    <div className="absolute bottom-2 left-1/2 transform -translate-x-1/2 text-white text-xs font-bold">
                                                        {progressPercentage}%
                                                    </div>
                                                )}
                                            </div>

                                            <div className="space-y-2">
                                                <p className="text-sm text-slate-500">
                                                    已完成 <span className="text-indigo-600 font-bold text-lg">{completedTasks.length}</span> / {selectedTasks.length}
                                                </p>
                                                <div className="text-xs text-slate-400">
                                                    {progressPercentage === 100 ? "任務罐已滿！完美達成！" : "繼續加油，填滿它！"}
                                                </div>
                                            </div>
                                            
                                            {/* 照片回顧牆 (Mini) */}
                                            {Object.keys(taskPhotos).length > 0 && (
                                                <div className="mt-8 pt-6 border-t border-slate-100">
                                                    <h4 className="text-sm font-semibold text-slate-600 mb-3">📸 照片回顧</h4>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        {Object.values(taskPhotos).map((src, idx) => (
                                                            <img key={idx} src={src} className="w-full h-16 object-cover rounded-lg shadow-sm border border-slate-100 hover:scale-110 transition-transform" />
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                    
                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                    `}</style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
